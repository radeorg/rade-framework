upstream sit_hioas {
    least_conn;
    server localhost:20001;
}

upstream aidesk {
    least_conn;
    server localhost:7071;
}

server {
    #SSL 默认访问端口号为 443
    listen 443 ssl;
    #请填写绑定证书的域名
    server_name hioas.com;
    #请填写证书文件的相对路径或绝对路径
    ssl_certificate  hioas.com_bundle.crt;
    #请填写私钥文件的相对路径或绝对路径
    ssl_certificate_key hioas.com.key;
    ssl_session_timeout 5m;
    #请按照以下套件配置，配置加密套件，写法遵循 openssl 标准。
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    #请按照以下协议配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    error_page   500 502 503 504  /50x.html;

    location / {
        root   /radeorg/nginx/html/;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /bole/sit {
        alias /radeorg/bole/admin/sit/dist;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /bole/dev {
        alias /radeorg/bole/admin/dev/dist;

        try_files $uri $uri/ /dev/index.html;
	# 配置静态资源缓存

	location ~ ^/bole/dev/(css|js|fonts|img)/ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }





    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ~ /\. {
        deny all;
    }


    location = /50x.html {
        root   /usr/share/nginx/html;
    }


    location /pdf {
        alias /radeorg/nginx/pdf;
        types {
            application/pdf pdf;
        }

        autoindex on;
        # 确保浏览器可以正确处理 PDF 文件
        add_header Content-Type 'application/pdf';
        add_header Content-Disposition 'inline; filename="$arg_filename"';
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=31536000";
        add_header Expires "Thu, 31 Dec 2037 23:55:55 GMT";
    }


    location /api/sit/ {
        proxy_pass http://sit_hioas/;
        # 允许常用的 HTTP 方法
        # 允许常用的 HTTP 方法
        if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$ ) {
            return 444;
        }
        # 处理 OPTIONS 请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
            add_header 'Content-Type' 'application/json; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }



    location /ai/{

    	rewrite ^/ai(.*)$ $1 break;
	proxy_pass http://aidesk/;
        # 允许常用的 HTTP 方法
        # 允许常用的 HTTP 方法
        if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$ ) {
            return 444;
        }
        # 处理 OPTIONS 请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
            add_header 'Content-Type' 'application/json; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    	location ~ ^/ai/assets/ {
        	rewrite ^/ai/assets(.*)$ /assets$1 break;
       		proxy_pass http://aidesk;
        	expires 30d;
        	add_header Cache-Control "public, no-transform";
   	    }
    }

    location ~ ^/(agent|index|chat|model|manager|rag|user)/ {
        proxy_pass http://aidesk;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}