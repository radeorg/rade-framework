name: "GitHub Repository"

on:
  push:
    branches: [ main, master ] # 主分支代码推送
  pull_request:
    types: [opened, synchronize, closed] #  PR 开启、更新和关闭
  watch:
    types: [started] # Star
  fork: #  Fork
  issues:
    types: [opened, edited] # 提 Issue
  release:
    types: [published] # 发布了新版本

jobs:
  send-notification:
    runs-on: ubuntu-latest
    # 避免脚本自己触发自己（如果是 Actions 产生的变动则跳过）
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Send Comprehensive Email
        uses: dawidd6/action-send-mail@v3
        with:
          # --- 1. 邮件服务器配置 (保持现状或根据你的邮箱修改) ---
          server_address: smtp.qq.com # 如果用 Gmail 请改 smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          # --- 2. 邮件动态标题 ---
          subject: "【仓库通知】${{ github.actor }} 对 ${{ github.repository }} 执行了 ${{ github.event_name }}"

          # --- 3. 接收人设置 ---
          to: your-email@example.com # ！！！请修改为你的接收邮箱！！！
          from: "GitHub 自动助手"

          # --- 4. 增强版邮件内容 ---
          body: |
            您好！您的 GitHub 仓库发生了新的互动：
            
            ● 操作用户: ${{ github.actor }}
            ● 动作类型: ${{ github.event_name }}
            ● 触发时间: ${{ github.event.repository.updated_at }}
            
            ------------------------------------------------
            【详细信息】
            ● 仓库名: ${{ github.repository }}
            ● 所在分支/标签: ${{ github.ref }}
            ● 操作人主页: https://github.com/${{ github.actor }}
            
            【快速入口】
            ● 查看本次变动: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            ● 查看仓库首页: https://github.com/${{ github.repository }}
